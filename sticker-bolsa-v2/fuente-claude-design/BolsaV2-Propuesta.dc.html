<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pide aquí · Bolsa v2 (propuesta)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }

    /* Capa holográfica: recortada a las zonas oscuras de la bolsa y fundida en modo "screen" sobre ella */
    .sb-mask { -webkit-mask: url(bolsa-mask.svg) center/contain no-repeat; mask: url(bolsa-mask.svg) center/contain no-repeat; mix-blend-mode: screen; }
    .sb-mask.h-cromo, .sb-mask.h-oro { mix-blend-mode: normal; }

    /* Entrada: el sticker "se pega" con un rebote; la etiqueta solo aparece, sin moverse */
    .sb-enter { animation: sb-enter 900ms cubic-bezier(0.2, 1.35, 0.35, 1) both; }
    .sb-label-in { animation: sb-label-in 450ms ease-out 520ms both; }
    @keyframes sb-enter {
      0% { opacity: 0; transform: translateY(34px) scale(0.5) rotate(-18deg); }
      45% { opacity: 1; }
      100% { opacity: 1; transform: none; }
    }
    @keyframes sb-label-in { from { opacity: 0; } to { opacity: 1; } }

    /* Reposo: flotación suave + un "llamado" periódico (meneo + destello sincronizados).
       Todo se atenúa con --idle (1 en reposo, 0 con el cursor encima) en vez de cortarse en seco. */
    .sb-wiggle { transform-origin: 50% 86%; animation: sb-wiggle 6s ease-in-out infinite; }
    .sb-float { animation: sb-float 5s ease-in-out infinite; }
    .sb-shadow-breathe { animation: sb-shadow-breathe 5s ease-in-out infinite; }
    @keyframes sb-float {
      0%, 100% { transform: translateY(calc(var(--idle) * 3px)) rotate(calc(var(--idle) * -0.7deg)); }
      50% { transform: translateY(calc(var(--idle) * -6px)) rotate(calc(var(--idle) * 0.7deg)); }
    }
    @keyframes sb-shadow-breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.965) translateY(3px); opacity: 0.78; }
    }
    @keyframes sb-wiggle {
      0%, 70%, 100% { transform: rotate(0deg) scale(1); }
      73.5% { transform: rotate(calc(var(--call) * -4.5deg)) scale(calc(1 + var(--call) * 0.04)); }
      77.5% { transform: rotate(calc(var(--call) * 3.6deg)) scale(calc(1 + var(--call) * 0.04)); }
      81.5% { transform: rotate(calc(var(--call) * -2.5deg)) scale(calc(1 + var(--call) * 0.025)); }
      85.5% { transform: rotate(calc(var(--call) * 1.5deg)) scale(calc(1 + var(--call) * 0.012)); }
      89.5% { transform: rotate(calc(var(--call) * -0.8deg)) scale(1); }
      94% { transform: rotate(calc(var(--call) * 0.3deg)) scale(1); }
    }

    /* Sombra: silueta desenfocada que se queda "en la mesa"; al levantar el sticker se aleja y se aclara */
    .sb-shadow {
      transform: translate3d(calc(var(--px) * -12px), calc(12px + var(--h) * 10px - var(--pr) * 13px - var(--py) * 8px), 0) scale(calc(1 + var(--h) * 0.03 - var(--pr) * 0.05));
      opacity: calc(var(--sh) * (1 - var(--h) * 0.3));
    }
    .sb-shadow img { filter: brightness(0) blur(9px); }

    /* Inclinación 3D con perspectiva real: el lado bajo el cursor se hunde, el sticker se levanta y cede al presionar */
    .sb-tilt {
      transform: perspective(900px)
        translate3d(calc(var(--px) * var(--mv) * 5px), calc(var(--py) * var(--mv) * 5px - var(--h) * var(--mv) * 4px), 0)
        rotateX(calc(var(--py) * var(--tilt) * -1deg)) rotateY(calc(var(--px) * var(--tilt) * 1deg))
        scale(calc(1 + var(--h) * 0.05 - var(--pr) * 0.08));
      filter: drop-shadow(0 1.5px 0 rgb(6 30 40 / 0.3));
      will-change: transform;
    }
    /* El isotipo flota un poco por encima de la bolsa (parallax) */
    .sb-logo { transform: translate3d(calc(var(--px) * var(--mv) * 3.5px), calc(var(--py) * var(--mv) * 3.5px), 0); }

    /* Lámina holográfica: más grande que la bolsa y desplazada con el cursor */
    .sb-tex, .sb-foil, .sb-glare, .sb-auto, .sb-burst { position: absolute; pointer-events: none; }
    .sb-tex { inset: 0; }
    .sb-foil {
      inset: -60%;
      transform: translate3d(calc(var(--px) * -26%), calc(var(--py) * -26%), 0);
      opacity: calc((0.26 + var(--h) * 0.2 + var(--mag) * 0.4 + var(--fl) * 0.35) * var(--int));
      will-change: transform;
    }
    .sb-glare {
      inset: -50%;
      background: radial-gradient(circle at 50% 50%, rgb(255 255 255 / 0.62) 0%, rgb(255 255 255 / 0.22) 15%, rgb(255 255 255 / 0) 36%);
      transform: translate3d(var(--gx), var(--gy), 0);
      opacity: calc(var(--h) * var(--glare));
    }
    .sb-auto, .sb-burst {
      inset: -100%;
      background: linear-gradient(115deg, transparent 44%, rgb(255 255 255 / 0.28) 47.5%, rgb(255 255 255 / 0.85) 50%, rgb(255 255 255 / 0.28) 52.5%, transparent 56%);
      opacity: 0;
    }
    .sb-auto { animation: sb-auto 6s cubic-bezier(0.45, 0, 0.25, 1) infinite; }
    .sb-burst { animation: sb-burst-a 650ms cubic-bezier(0.3, 0, 0.2, 1) both; }
    @keyframes sb-auto {
      0%, 66% { transform: translate3d(-34%, -34%, 0); opacity: 0; }
      70% { opacity: var(--auto); }
      84% { opacity: var(--auto); }
      90%, 100% { transform: translate3d(34%, 34%, 0); opacity: 0; }
    }
    @keyframes sb-burst-a { 0% { transform: translate3d(-34%, -34%, 0); opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate3d(34%, 34%, 0); opacity: 0; } }
    @keyframes sb-burst-b { 0% { transform: translate3d(-34%, -34%, 0); opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate3d(34%, 34%, 0); opacity: 0; } }

    /* Tipos de holográfico */
    .h-aurora .sb-foil { background-image: repeating-linear-gradient(115deg, hsl(196 90% 62%) 0%, hsl(226 85% 70%) 8%, hsl(170 80% 58%) 17%, hsl(262 75% 72%) 26%, hsl(196 90% 62%) 34%); }
    .h-arcoiris .sb-foil { background-image: repeating-linear-gradient(115deg, hsl(0 92% 62%) 0%, hsl(40 96% 58%) 5.5%, hsl(92 85% 55%) 11%, hsl(165 90% 52%) 17%, hsl(205 96% 60%) 23%, hsl(265 92% 70%) 29%, hsl(320 92% 64%) 35%, hsl(360 92% 62%) 40%); }
    .h-prisma .sb-foil { background-image: repeating-linear-gradient(100deg, hsl(0 95% 62%) 0%, hsl(45 100% 58%) 3%, hsl(120 90% 55%) 6%, hsl(185 100% 55%) 9%, hsl(235 100% 68%) 12%, hsl(300 95% 65%) 15%, hsl(360 95% 62%) 18%); }
    .h-prisma .sb-tex { -webkit-mask-image: repeating-linear-gradient(-38deg, #000 0 1.4px, rgb(0 0 0 / 0.22) 1.4px 4.2px); mask-image: repeating-linear-gradient(-38deg, #000 0 1.4px, rgb(0 0 0 / 0.22) 1.4px 4.2px); }
    .h-disco .sb-foil {
      background-image: repeating-conic-gradient(from 20deg at 50% 50%, hsl(0 92% 62%) 0deg, hsl(48 98% 58%) 10deg, hsl(125 88% 55%) 20deg, hsl(188 98% 56%) 30deg, hsl(240 98% 70%) 40deg, hsl(305 92% 65%) 50deg, hsl(360 92% 62%) 60deg);
      transform: translate3d(calc(var(--px) * 18%), calc(var(--py) * 18%), 0) rotate(calc(var(--px) * 50deg + var(--py) * 30deg));
    }
    .h-disco .sb-tex { -webkit-mask-image: repeating-radial-gradient(circle at 42% 38%, #000 0 1.2px, rgb(0 0 0 / 0.38) 1.2px 4px); mask-image: repeating-radial-gradient(circle at 42% 38%, #000 0 1.2px, rgb(0 0 0 / 0.38) 1.2px 4px); }
    .h-destellos .sb-foil { background-image: repeating-linear-gradient(115deg, hsl(0 100% 72%) 0%, hsl(45 100% 68%) 4%, hsl(110 95% 64%) 8%, hsl(180 100% 64%) 12%, hsl(225 100% 76%) 16%, hsl(295 100% 74%) 20%, hsl(360 100% 72%) 24%); opacity: calc((0.6 + var(--h) * 0.4) * var(--int)); }
    .h-destellos .sb-tex {
      --dots:
        radial-gradient(circle at 12% 18%, #000 0 1.2px, transparent 2px), radial-gradient(circle at 58% 41%, #000 0 1.8px, transparent 2.7px),
        radial-gradient(circle at 83% 77%, #000 0 1px, transparent 1.7px), radial-gradient(circle at 31% 88%, #000 0 1.4px, transparent 2.2px),
        radial-gradient(circle at 22% 61%, #000 0 2.2px, transparent 3.2px), radial-gradient(circle at 71% 14%, #000 0 1.2px, transparent 2px),
        radial-gradient(circle at 47% 36%, #000 0 0.9px, transparent 1.6px), radial-gradient(circle at 90% 52%, #000 0 1.5px, transparent 2.3px),
        radial-gradient(circle at 40% 25%, #000 0 1px, transparent 1.7px), radial-gradient(circle at 76% 70%, #000 0 1.3px, transparent 2.1px),
        radial-gradient(circle at 10% 55%, #000 0 0.8px, transparent 1.5px),
        linear-gradient(rgb(0 0 0 / 0.13), rgb(0 0 0 / 0.13));
      --dots-size: 67px 71px, 67px 71px, 67px 71px, 67px 71px, 97px 89px, 97px 89px, 97px 89px, 97px 89px, 53px 59px, 53px 59px, 53px 59px, auto;
      -webkit-mask-image: var(--dots); mask-image: var(--dots);
      -webkit-mask-size: var(--dots-size); mask-size: var(--dots-size);
    }
    .h-destellos .sb-tex::before, .h-destellos .sb-tex::after {
      content: ""; position: absolute; inset: 0; opacity: 0;
      background-image: radial-gradient(circle at 18% 30%, #fff 0 1.5px, transparent 2.6px), radial-gradient(circle at 64% 72%, #fff 0 1.1px, transparent 2px), radial-gradient(circle at 86% 22%, #fff 0 1.3px, transparent 2.3px);
      background-size: 83px 79px, 83px 79px, 83px 79px;
      animation: sb-twinkle 2.8s ease-in-out infinite;
    }
    .h-destellos .sb-tex::after { background-size: 71px 91px, 71px 91px, 71px 91px; background-position: 37px 23px; animation-delay: -1.4s; }
    @keyframes sb-twinkle { 0%, 100% { opacity: 0; } 50% { opacity: var(--int); } }
    .h-nacar .sb-foil { background-image: repeating-linear-gradient(125deg, hsl(332 92% 72%) 0%, hsl(192 90% 64%) 12%, hsl(56 95% 70%) 24%, hsl(282 80% 72%) 36%, hsl(332 92% 72%) 48%); opacity: calc((0.2 + var(--h) * 0.14 + var(--mag) * 0.3 + var(--fl) * 0.3) * var(--int)); }
    .h-cromo .sb-foil { background-image: repeating-linear-gradient(115deg, hsl(210 30% 97% / 0.95) 0%, hsl(210 16% 60% / 0.3) 7%, hsl(205 30% 86% / 0.8) 13%, hsl(215 16% 50% / 0.18) 21%, hsl(210 24% 74% / 0.6) 27%, hsl(210 30% 97% / 0.95) 34%); opacity: calc((0.34 + var(--h) * 0.26 + var(--mag) * 0.4 + var(--fl) * 0.3) * var(--int)); }
    .h-oro .sb-foil { background-image: repeating-linear-gradient(115deg, hsl(48 100% 76% / 0.95) 0%, hsl(36 92% 48% / 0.35) 8%, hsl(44 98% 60% / 0.85) 15%, hsl(30 88% 40% / 0.2) 23%, hsl(50 100% 84% / 1) 30%, hsl(48 100% 76% / 0.95) 34%); opacity: calc((0.34 + var(--h) * 0.26 + var(--mag) * 0.4 + var(--fl) * 0.3) * var(--int)); }

    .sb-btn:focus-visible { outline: 3px solid hsl(196 90% 62%); outline-offset: 8px; border-radius: 28px; }

    @media (prefers-reduced-motion: reduce) {
      .sb-enter, .sb-label-in, .sb-wiggle, .sb-float, .sb-shadow-breathe, .sb-auto, .sb-burst, .h-destellos .sb-tex::before, .h-destellos .sb-tex::after { animation: none; }
    }
  </style>
</helmet>
<div
  style="width:600px;height:660px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:{{ bgColor }};--px:{{ px }};--py:{{ py }};--h:{{ h }};--pr:{{ pr }};--fl:{{ fl }};--mag:{{ mag }};--idle:{{ idle }};--call:{{ call }};--tilt:{{ tilt }};--mv:{{ mv }};--int:{{ intensity }};--auto:{{ auto }};--glare:{{ glare }};--gx:{{ gx }};--gy:{{ gy }};--sh:{{ sh }};"
  onPointerMove="{{ onMove }}"
  onPointerLeave="{{ onLeave }}"
>
  <div style="position:relative;width:380px;height:420px;display:flex;align-items:center;justify-content:center;transform:{{ stageTransform }};">
    <button
      class="sb-btn"
      onClick="{{ onClick }}"
      onPointerDown="{{ onDown }}"
      onPointerUp="{{ onUp }}"
      aria-label="Pide aquí"
      style="position:relative;display:block;flex:none;border:none;padding:0;background:transparent;cursor:pointer;width:300px;height:328px;-webkit-tap-highlight-color:transparent;"
    >
      <div class="{{ enterClass }}" style="position:absolute;inset:0;">
        <div class="sb-wiggle" style="position:absolute;inset:0;animation-duration:{{ interval }};">
          <div class="sb-shadow" style="position:absolute;inset:0;">
            <div class="sb-shadow-breathe" style="position:absolute;inset:0;animation-duration:{{ floatDuration }};">
              <img src="bolsa.svg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;"></img>
            </div>
          </div>
          <div class="sb-float" style="position:absolute;inset:0;animation-duration:{{ floatDuration }};">
            <div class="sb-tilt" style="position:absolute;inset:0;">
              <img src="bolsa-base.svg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;"></img>
              <div class="sb-mask {{ holoClass }}" style="position:absolute;inset:0;overflow:hidden;">
                <div class="sb-tex"><div class="sb-foil"></div></div>
                <div class="sb-glare"></div>
                <div class="sb-auto" style="animation-duration:{{ interval }};"></div>
                <div class="sb-burst" style="animation-name:{{ burstName }};"></div>
              </div>
              <img class="sb-logo" src="bolsa-logo.svg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;"></img>
            </div>
          </div>
        </div>
      </div>

      <img class="{{ labelClass }}" src="etiqueta.svg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;filter:{{ labelShadow }};"></img>
    </button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:660},&quot;holoType&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Cromo&quot;,&quot;options&quot;:[&quot;Aurora&quot;,&quot;Arcoíris&quot;,&quot;Prisma&quot;,&quot;Disco&quot;,&quot;Destellos&quot;,&quot;Nácar&quot;,&quot;Cromo&quot;,&quot;Oro&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Holográfico&quot;},&quot;holoIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.75,&quot;min&quot;:0,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Holográfico&quot;},&quot;glare&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Holográfico&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:16,&quot;min&quot;:0,&quot;max&quot;:24,&quot;step&quot;:1,&quot;unit&quot;:&quot;°&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Movimiento&quot;},&quot;floatOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Movimiento&quot;},&quot;attention&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Movimiento&quot;},&quot;attentionInterval&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6.5,&quot;min&quot;:3,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Movimiento&quot;},&quot;entrance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Movimiento&quot;},&quot;shadowOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.4,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Sombras&quot;},&quot;stickerScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.4,&quot;min&quot;:0.5,&quot;max&quot;:1.6,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Sticker&quot;},&quot;bgColor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;transparent&quot;,&quot;options&quot;:[&quot;#1e2733&quot;,&quot;#053647&quot;,&quot;#f4ede2&quot;,&quot;#ffffff&quot;,&quot;transparent&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Fondo&quot;}}">
class Component extends DCLogic {
  state = { px: 0, py: 0, h: 0, pr: 0, fl: 0, burst: 0 };

  // Simulación de resortes: el sticker persigue al cursor con inercia, rebota al soltar el clic
  // y vuelve a su sitio con un vaivén corto cuando el cursor sale.
  keys = ['px', 'py', 'h', 'pr', 'fl'];
  cur = { px: 0, py: 0, h: 0, pr: 0, fl: 0 };
  vel = { px: 0, py: 0, h: 0, pr: 0, fl: 0 };
  target = { px: 0, py: 0, h: 0, pr: 0, fl: 0 };
  spring = { px: [130, 13], py: [130, 13], h: [140, 24], pr: [520, 19], fl: [38, 13] };
  raf = 0;
  last = 0;
  reduced = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

  componentWillUnmount() { if (this.raf) cancelAnimationFrame(this.raf); }

  kick() {
    if (this.raf) return;
    this.last = performance.now();
    this.raf = requestAnimationFrame(this.step);
  }

  step = (now) => {
    const dt = Math.min(0.034, Math.max(0.001, (now - this.last) / 1000));
    this.last = now;
    let moving = false;
    for (const k of this.keys) {
      const [stiff, damp] = this.spring[k];
      const acc = (this.target[k] - this.cur[k]) * stiff - this.vel[k] * damp;
      this.vel[k] += acc * dt;
      this.cur[k] += this.vel[k] * dt;
      if (Math.abs(this.vel[k]) > 0.002 || Math.abs(this.target[k] - this.cur[k]) > 0.002) moving = true;
      else { this.cur[k] = this.target[k]; this.vel[k] = 0; }
    }
    const c = this.cur;
    this.setState({ px: c.px, py: c.py, h: c.h, pr: c.pr, fl: c.fl });
    this.raf = moving ? requestAnimationFrame(this.step) : 0;
  };

  onMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const px = (e.clientX - (rect.left + rect.width / 2)) / (rect.width / 2);
    const py = (e.clientY - (rect.top + rect.height / 2)) / (rect.height / 2);
    this.target.px = Math.max(-1, Math.min(1, px));
    this.target.py = Math.max(-1, Math.min(1, py));
    this.target.h = 1;
    this.kick();
  };
  onLeave = () => {
    this.target.px = 0; this.target.py = 0; this.target.h = 0; this.target.pr = 0;
    this.kick();
  };
  onDown = () => { this.target.pr = 1; this.kick(); };
  onUp = () => { this.target.pr = 0; this.kick(); };
  onClick = () => {
    // Respuesta al clic: destello que barre la bolsa + el holográfico se enciende un instante
    this.cur.fl = 1;
    this.setState({ burst: this.state.burst + 1 });
    this.kick();
  };

  renderVals() {
    const { px, py, burst } = this.state;
    const h = Math.max(0, Math.min(1, this.state.h));
    const mag = Math.min(1, (Math.abs(px) + Math.abs(py)) / 1.2);
    const scale = this.props.stickerScale ?? 1.4;
    const shOp = this.props.shadowOpacity ?? 0.4;
    const intensity = this.props.holoIntensity ?? 1;
    const floatOn = (this.props.floatOn ?? true) && !this.reduced;
    const attention = (this.props.attention ?? true) && !this.reduced;
    const entrance = (this.props.entrance ?? true) && !this.reduced;
    const classes = { 'Aurora': 'h-aurora', 'Arcoíris': 'h-arcoiris', 'Prisma': 'h-prisma', 'Disco': 'h-disco', 'Destellos': 'h-destellos', 'Nácar': 'h-nacar', 'Cromo': 'h-cromo', 'Oro': 'h-oro' };

    return {
      onMove: this.onMove,
      onLeave: this.onLeave,
      onDown: this.onDown,
      onUp: this.onUp,
      onClick: this.onClick,
      px: px.toFixed(4),
      py: py.toFixed(4),
      h: h.toFixed(4),
      pr: this.state.pr.toFixed(4),
      fl: Math.max(0, this.state.fl).toFixed(4),
      mag: mag.toFixed(4),
      idle: (floatOn ? 1 - h : 0).toFixed(4),
      call: (attention ? 1 - h : 0).toFixed(4),
      tilt: `${this.reduced ? 0 : (this.props.tilt ?? 14)}`,
      mv: this.reduced ? '0' : '1',
      intensity: `${intensity}`,
      auto: attention ? `${Math.min(1, 0.9 * intensity)}` : '0',
      glare: (this.props.glare ?? true) ? `${Math.min(1, 0.85 * intensity)}` : '0',
      // El reflejo sigue la posición real del cursor sobre la bolsa (el marco mide 600×660)
      gx: `${(px * 300 / scale).toFixed(2)}px`,
      gy: `${(py * 330 / scale).toFixed(2)}px`,
      sh: `${shOp}`,
      holoClass: classes[this.props.holoType] ?? 'h-prisma',
      enterClass: entrance ? 'sb-enter' : '',
      labelClass: entrance ? 'sb-label-in' : '',
      burstName: burst === 0 ? 'none' : (burst % 2 ? 'sb-burst-a' : 'sb-burst-b'),
      interval: `${this.props.attentionInterval ?? 6}s`,
      floatDuration: '5s',
      stageTransform: `scale(${scale})`,
      bgColor: this.props.bgColor ?? 'transparent',
      labelShadow: `drop-shadow(0 3px 5px rgb(4 20 30 / ${(shOp * 0.8).toFixed(3)}))`,
    };
  }
}
</script>
</body>
</html>
